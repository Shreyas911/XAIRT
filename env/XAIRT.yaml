# Keras (innvestigate) and PyTorch (Captum) side by side, to compare the two XAI libraries.
#
#   CONDA_OVERRIDE_CUDA=11.2 mamba env create -f env/XAIRT.yaml     # on a machine without a GPU
#   mamba env create -f env/XAIRT.yaml                              # on a GPU node
#
# Target: x86_64 Linux. Developed on a CPU-only box, run on NVIDIA GPUs (Lonestar6, A100).
# CONDA_OVERRIDE_CUDA is needed off-GPU because conda-forge's GPU builds require a CUDA driver.
#
# Why these pins (from the last known-good env, "Working py310_LRP env" on main):
#   * python 3.10 + tensorflow 2.9.1 : innvestigate 2.1.2 needs python <3.12 and
#     tensorflow >=2.6,<2.15, and newer TF ships Keras 3, which breaks tensorflow.keras.
#   * TF's CUDA 11 libraries (cudatoolkit, cudnn, nccl) come from conda. Torch comes from pip,
#     whose wheels bundle their own CUDA 12 libraries. Nearly all of those have different names from
#     the conda ones and do not clash. NCCL is the exception: both are libnccl.so.2, and the first one
#     loaded wins. TensorFlow loads first (XAIRT and most scripts import it first), so torch gets the
#     conda NCCL, and a torch whose NCCL is newer fails to import with "undefined symbol: ncclCommResume".
#     The unpinned torch of 2.14+cu130 did that (NCCL 2.30, conda has 2.27.3). torch 2.8.0 needs exactly
#     nvidia-nccl-cu12==2.27.3, the conda version, and is a CUDA 12.8 build, whose driver requirement is
#     lower than that of CUDA 13. If the conda nccl changes, check that torch 2.8.0 still matches it.
#   * numpy, protobuf and keras are not pinned: the conda-forge TF build constrains them (numpy <2,
#     keras 2.9, libprotobuf 3.20). Do not add protobuf <3.20, it conflicts with that libprotobuf.
#     The old env broke because pip later replaced numpy, protobuf and keras with numpy 2, protobuf 7
#     and keras 3, so after the pip step check: pip list | grep -i -E "^(numpy|protobuf|keras) "
#
# TF 2.9.1 has no ARM wheel, so this file does not work on Vista (aarch64). That would need
# tensorflow 2.10 to 2.14 instead.
#
# captum is not pinned yet (0.9.0 was installed). Once the results look right, record the versions
# (pip freeze | grep -i -E "torch|captum") and pin it here.

name: XAIRT
channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip

  # Core
  - numpy
  - scipy
  - scikit-learn
  - matplotlib
  - imageio
  - beartype
  - jaxtyping

  # TensorFlow / Keras, GPU build. conda-forge names its GPU builds cuda<ver>py<ver>, the
  # gpu_py310* builds are on the defaults channel only. The build itself pulls in cudatoolkit,
  # cudnn, nccl, keras 2.9, protobuf 3.20 and numpy <2, so none of them is listed here.
  - tensorflow==2.9.1=cuda112py310*

  # ECCO stack used by the notebooks
  - xarray
  - netCDF4
  - dask
  - cftime
  - xmitgcm
  - xgcm
  - ecco_v4_py
  - cartopy
  - cmocean
  - pyresample

  # Jupyter
  - jupyterlab
  - ipython
  - ipykernel

  - pip:
      - innvestigate==2.1.2
      - torch==2.8.0    # see the NCCL note above
      - captum
