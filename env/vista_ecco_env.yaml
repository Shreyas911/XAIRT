name: vista_ecco_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11.8
  - pip
  - gcc=12.1.0  # Closest stable conda version to 15.1
  - cuda-toolkit=12.1  # Matches your requested CUDA 12.x series
  - nccl=2.19.3
  - numpy
  - pandas
  - matplotlib
  - pip:
      - torch
      - torchvision
      - torchaudio
      - captum
      - cmocean
      - xarray
      - ecco_v4_py
      - scikit-learn
      - scipy
      - dask
      - netCDF4
