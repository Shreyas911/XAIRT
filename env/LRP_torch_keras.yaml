# conda env create -f LRP_torch_keras.yaml
name: LRP_torch_keras
channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - matplotlib
  - scipy
  - scikit-learn
  - xarray
  - dask
  - netCDF4
  - ipykernel
  - jupyter
  - jupyterlab
  - ipython
  - cmocean
  - beartype
  - jaxtyping

  # PyTorch CUDA via conda
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  - pip:
      - captum
      - ecco_v4_py
      - innvestigate
      - tensorflow

